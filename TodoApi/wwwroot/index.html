<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Todo & Books Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; }
    h2 { margin-top: 2rem; }
    form, ul { margin-top: 1rem; }
    li { display:flex; gap:.5rem; align-items:center; }
    input[type="text"] { padding:.4rem .6rem; }
    button { cursor:pointer; padding:.4rem .7rem; }
    code { background:#f4f4f4; padding:.2rem .4rem; border-radius:4px; }
  </style>
</head>
<body>
  <h1>Web API with JavaScript</h1>
  <p>Calls your ASP.NET Core controllers via <code>fetch</code>.</p>

  <h2>Todos</h2>
  <form id="todoForm">
    <input id="todoName" type="text" placeholder="New todo name" required />
    <label><input id="todoDone" type="checkbox" /> complete</label>
    <button type="submit">Add</button>
  </form>
  <ul id="todoList"></ul>

  <h2>Books</h2>
  <form id="bookForm">
    <input id="bookTitle" type="text" placeholder="Title" required />
    <input id="bookAuthor" type="text" placeholder="Author" required />
    <input id="bookCategory" type="text" placeholder="Category" />
    <input id="bookPrice" type="number" step="0.01" placeholder="Price" />
    <button type="submit">Add</button>
  </form>
  <ul id="bookList"></ul>

<script>
  // Use relative paths so it works on any port:
  const todoBase = "/api/TodoItems";
  const bookBase = "/api/Books";

  // ----- Todos -----
  async function loadTodos() {
    const r = await fetch(todoBase);
    const data = await r.json();
    const ul = document.getElementById("todoList");
    ul.innerHTML = "";
    for (const t of data) {
      const li = document.createElement("li");
      const chk = Object.assign(document.createElement("input"), { type: "checkbox", checked: t.isComplete });
      const title = Object.assign(document.createElement("span"), { textContent: t.name, contentEditable: "true" });
      const save = Object.assign(document.createElement("button"), { textContent: "Save" });
      const del = Object.assign(document.createElement("button"), { textContent: "Delete" });

      save.onclick = async () => {
        await fetch(`${todoBase}/${t.id}`, {
          method: "PUT",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ id: t.id, name: title.textContent, isComplete: chk.checked })
        });
        loadTodos();
      };
      del.onclick = async () => {
        await fetch(`${todoBase}/${t.id}`, { method: "DELETE" });
        loadTodos();
      };

      li.append(chk, title, save, del);
      ul.append(li);
    }
  }

  document.getElementById("todoForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await fetch(todoBase, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        name: document.getElementById("todoName").value,
        isComplete: document.getElementById("todoDone").checked
      })
    });
    e.target.reset();
    loadTodos();
  });

  // ----- Books -----
  async function loadBooks() {
    const r = await fetch(bookBase);
    const data = await r.json();
    const ul = document.getElementById("bookList");
    ul.innerHTML = "";
    for (const b of data) {
      const li = document.createElement("li");
      li.textContent = `${b.title} — ${b.author} (${b.category || "n/a"}) $${b.price ?? 0}`;
      const del = Object.assign(document.createElement("button"), { textContent: "Delete" });
      del.onclick = async () => {
        await fetch(`${bookBase}/${b.id}`, { method: "DELETE" });
        loadBooks();
      };
      li.append(" ", del);
      ul.append(li);
    }
  }

  document.getElementById("bookForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await fetch(bookBase, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        title: document.getElementById("bookTitle").value,
        author: document.getElementById("bookAuthor").value,
        category: document.getElementById("bookCategory").value,
        price: Number(document.getElementById("bookPrice").value || 0)
      })
    });
    e.target.reset();
    loadBooks();
  });

  // initial load
  loadTodos();
  loadBooks();
</script>
</body>
</html>
